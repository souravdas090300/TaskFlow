version: '3.8'

services:
  # 1. TaskFlow API (.NET Application)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskflow-api-dev
    env_file:
      - .env.dev
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=taskflow;Username=taskflow;Password=${DB_PASSWORD}
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
    ports:
      - "5000:80"
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - taskflow-network
    restart: unless-stopped

  # 1b. Database migrator (runs EF migrations bundle once, then exits)
  migrator:
    build:
      context: .
      dockerfile: Dockerfile.migrator
    container_name: taskflow-migrator-dev
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=taskflow;Username=taskflow;Password=${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - taskflow-network
    restart: "no"

  # 2. TaskFlow Frontend (React + Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: taskflow-frontend-dev
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - taskflow-network
    restart: unless-stopped

  # 3. PostgreSQL Database
  db:
    image: postgres:17-alpine
    container_name: taskflow-db-dev
    environment:
      - POSTGRES_DB=taskflow
      - POSTGRES_USER=taskflow
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - taskflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  taskflow-network:
    driver: bridge

volumes:
  postgres-data-dev:
    driver: local
