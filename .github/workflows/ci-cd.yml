name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build API
      run: dotnet build TaskFlow.API/TaskFlow.API.csproj --configuration Release --no-restore

    - name: Run unit tests
      run: dotnet test TaskFlow.UnitTests/TaskFlow.UnitTests.csproj --configuration Release --no-build --verbosity normal

    - name: Build frontend
      run: |
        cd frontend
        npm ci
        npm run build

    - name: Docker build API
      run: docker build -f Dockerfile -t taskflow-api:${{ github.sha }} .

    - name: Docker build frontend
      run: docker build -f Dockerfile.frontend -t taskflow-frontend:${{ github.sha }} .

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
