name: Deploy TaskFlow to Production VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_API: ${{ github.repository }}/taskflow-api
  IMAGE_FRONTEND: ${{ github.repository }}/taskflow-frontend
  IMAGE_MIGRATOR: ${{ github.repository }}/taskflow-migrator

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Run Unit Tests
      run: dotnet test TaskFlow.UnitTests/TaskFlow.UnitTests.csproj --configuration Release --verbosity normal

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for API image
      id: meta-api
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_API }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Extract metadata for Frontend image
      id: meta-frontend
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and Push API Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta-api.outputs.tags }}
        labels: ${{ steps.meta-api.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and Push Frontend Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.frontend
        push: true
        tags: ${{ steps.meta-frontend.outputs.tags }}
        labels: ${{ steps.meta-frontend.outputs.labels }}
        build-args: |
          VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and Push Migrator Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.migrator
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_MIGRATOR }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Execute Remote SSH Deployment
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST_IP }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        script: |
          set -e
          cd /home/${{ secrets.VPS_USERNAME }}/TaskFlow || exit 1
          
          git fetch origin main
          git reset --hard origin/main
          
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          printf '%s\n' \
            'DB_PASSWORD=${{ secrets.DB_PASSWORD }}' \
            'GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}' \
            'GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}' \
            'DUCKDNS_SUBDOMAIN=${{ secrets.DUCKDNS_SUBDOMAIN }}' \
            'DUCKDNS_TOKEN=${{ secrets.DUCKDNS_TOKEN }}' \
            'ASPNETCORE_ENVIRONMENT=Production' \
            'JWT__Key=${{ secrets.JWT_KEY }}' \
            'Stripe__SecretKey=${{ secrets.STRIPE_SECRET_KEY }}' \
            'Stripe__WebhookSecret=${{ secrets.STRIPE_WEBHOOK_SECRET }}' \
            'Resend__ApiKey=${{ secrets.RESEND_API_KEY }}' \
            'Resend__FromEmail=${{ secrets.RESEND__FROMEMAIL }}' \
            'App__PublicUrl=${{ secrets.APP_PUBLIC_URL }}' \
            'DOCKER_IMAGE_API=ghcr.io/${{ github.repository }}/taskflow-api:latest' \
            'DOCKER_IMAGE_FRONTEND=ghcr.io/${{ github.repository }}/taskflow-frontend:latest' \
            'DOCKER_IMAGE_MIGRATOR=ghcr.io/${{ github.repository }}/taskflow-migrator:latest' \
            > .env
          
          sudo docker compose pull
          sudo docker compose up -d --remove-orphans
          sudo docker image prune -f
          echo "Deployment completed successfully!"